services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inspectai
      POSTGRES_PASSWORD: inspectai
      POSTGRES_DB: inspectai
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspectai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest # docker.io pull denied in this environment; quay mirror works
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: inspectai
      MINIO_ROOT_PASSWORD: inspectai-secret
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 inspectai inspectai-secret &&
      mc mb --ignore-existing local/inspectai-evidence &&
      mc mb --ignore-existing local/inspectai-reports
      "
